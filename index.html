<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FLUK CHAFE ฟลุ๊ค ชาเฟ่</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030712">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FLUKCHAFE">

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    
    <!-- Google Fonts & Phosphor Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg-base: #030712;
            --surface-card: rgba(15, 23, 42, 0.82);
            --surface-border: rgba(255, 255, 255, 0.12);
            --surface-hover: rgba(255, 255, 255, 0.05);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --brand-primary: #0284c7;
            --brand-accent: #38bdf8;
            --brand-glow: rgba(56, 189, 248, 0.35);
            
            --success-color: #10b981;
            --success-glow: rgba(16, 185, 129, 0.3);
            --danger-color: #f43f5e;
            --warning-color: #f59e0b;
            
            --glass-blur: blur(20px);
            --radius-card: 20px;
            --radius-pill: 50px;
        }

        body.light-mode {
            --bg-base: #f1f5f9;
            --surface-card: rgba(255, 255, 255, 0.96);
            --surface-border: #e2e8f0;
            --surface-hover: #e8edf4;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        input, textarea, select {
            user-select: text;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 50% 0%, rgba(2, 132, 199, 0.2) 0px, transparent 65%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.85) 0px, transparent 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 10px 8px 30px;
            color: var(--text-primary);
            transition: background-color 0.3s ease;
        }

        body.light-mode {
            background-image: 
                radial-gradient(at 50% 0%, rgba(2, 132, 199, 0.08) 0px, transparent 65%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.04) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(241, 245, 249, 0.95) 0px, transparent 100%);
        }

        .main-wrapper {
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
