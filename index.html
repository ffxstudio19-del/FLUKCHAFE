<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ฟลุ๊คชาเฟ่ - บันทึกยอดขาย</title>
    
    <!-- โลโก้ไอคอนสำหรับเปิดบนเบราว์เซอร์และหน้าจอโฮมมือถือ -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; margin: 0; padding: 0; }
        body { background-color: #f1f5f9; padding: 12px; color: #1e293b; }
        .container { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        /* ส่วนหัวโลโก้ร้าน */
        .brand-header {
            text-align: center;
            margin-bottom: 14px;
        }
        .brand-logo {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
            border: 2px solid #0284c7;
        }
        .brand-name {
            font-size: 1.35rem;
            font-weight: 600;
            color: #0f172a;
            margin-top: 4px;
        }

        .total-banner {
            background: #0f172a;
            color: #fff;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 12px;
        }
        .total-banner .amount { font-size: 2.3rem; font-weight: 600; color: #38bdf8; line-height: 1.1; }
        .total-banner .sub { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }

        .category-summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }
        .cat-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px;
        }
        .cat-title { font-size: 0.8rem; color: #64748b; font-weight: 500; }
        .cat-val { font-size: 1.1rem; font-weight: 600; color: #0f172a; margin-top: 2px; }
        .cat-count { font-size: 0.75rem; color: #0284c7; }

        .cat-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }
        .cat-btn {
            background: #e2e8f0;
            border: none;
            padding: 8px 2px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 500;
            color: #475569;
        }
        .cat-btn.active {
            background: #0284c7;
            color: #fff;
        }

        .quick-input-box { margin-bottom: 16px; }
        .quick-input-box input {
            width: 100%;
            padding: 14px 16px;
            font-size: 1.15rem;
            border: 2px solid #0284c7;
            border-radius: 10px;
            outline: none;
            background: #f8fafc;
        }
        .quick-input-box input:focus { background: #fff; border-color: #0369a1; }
        .hint { font-size: 0.75rem; color: #64748b; margin-top: 6px; line-height: 1.4; padding-left: 2px; }

        .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: #e2e8f0;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            color: #475569;
        }
        .tab-btn.active { background: #0f172a; color: #fff; }

        .list-container { max-height: 320px; overflow-y: auto; }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 4px;
            border-bottom: 1px solid #f1f5f9;
        }
        .item-title { font-size: 0.95rem; font-weight: 500; }
        .item-detail { font-size: 0.75rem; color: #64748b; }
        .item-price { font-size: 1.05rem; font-weight: 600; color: #0f172a; margin-right: 8px; }
        .badge {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            margin-left: 4px;
            background: #e0f2fe;
            color: #0369a1;
        }
        .btn-del {
            background: #fee2e2;
            color: #ef4444;
            border: none;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .summary-group-title {
            background: #f1f5f9;
            padding: 6px 10px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            border-radius: 6px;
            margin: 10px 0 6px 0;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 8px;
            border-bottom: 1px solid #f8fafc;
            font-size: 0.9rem;
        }
        .empty-text {
            text-align: center;
            color: #94a3b8;
            padding: 24px 0;
            font-size: 0.9rem;
        }
        .btn-clear {
            display: block;
            width: 100%;
            margin-top: 16px;
            background: none;
            border: 1px dashed #cbd5e1;
            color: #94a3b8;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- โลโก้และชื่อร้าน -->
    <div class="brand-header">
        <img src="logo.png" alt="ฟลุ๊คชาเฟ่" class="brand-logo" onerror="this.style.display='none'">
        <div class="brand-name">ฟลุ๊คชาเฟ่</div>
    </div>

    <div class="total-banner">
        <div class="amount" id="totalAmount">฿0</div>
        <div class="sub" id="totalItems">ยอดขายรวมวันนี้</div>
    </div>

    <!-- สรุปแยก 4 หมวดหมู่ -->
    <div class="category-summary-grid">
        <div class="cat-box">
            <div class="cat-title">🧋 เครื่องดื่ม</div>
            <div class="cat-val" id="catDrinkSum">฿0</div>
            <div class="cat-count" id="catDrinkCount">0 แก้ว</div>
        </div>
        <div class="cat-box">
            <div class="cat-title">🍟 ของทอด/ทานเล่น</div>
            <div class="cat-val" id="catSnackSum">฿0</div>
            <div class="cat-count" id="catSnackCount">0 รายการ</div>
        </div>
        <div class="cat-box">
            <div class="cat-title">🍞 ปังปิ้ง</div>
            <div class="cat-val" id="catBreadSum">฿0</div>
            <div class="cat-count" id="catBreadCount">0 ชิ้น</div>
        </div>
        <div class="cat-box">
            <div class="cat-title">🍳 กะเพรา/อาหาร/อื่นๆ</div>
            <div class="cat-val" id="catFoodSum">฿0</div>
            <div class="cat-count" id="catFoodCount">0 จาน</div>
        </div>
    </div>

    <!-- แป้นเลือกหมวดหมู่อัตโนมัติ/ระบุเอง -->
    <div class="cat-selector">
        <button type="button" class="cat-btn active" onclick="setCategory('auto', this)">🤖 ออโต้</button>
        <button type="button" class="cat-btn" onclick="setCategory('เครื่องดื่ม', this)">🧋 น้ำ</button>
        <button type="button" class="cat-btn" onclick="setCategory('ของทอด/ทานเล่น', this)">🍟 ของทอด</button>
        <button type="button" class="cat-btn" onclick="setCategory('ขนมปังปิ้ง', this)">🍞 ปังปิ้ง</button>
    </div>

    <!-- ช่องกรอกรายการขาย -->
    <form id="quickForm" class="quick-input-box" onsubmit="return handleAdd(event)">
        <input 
            type="text" 
            id="quickInput" 
            placeholder="เช่น ชาเขียว 30 2 หรือ กะเพรา 50" 
            autocomplete="off" 
            autofocus
        >
        <div class="hint">
            💡 พิมพ์ <code>ชาไทย 25 2</code> (50 บ. 2 แก้ว) หรือ <code>เฟรนฟราย 39</code>
        </div>
    </form>

    <div class="tabs">
        <button type="button" class="tab-btn active" id="tabHistory" onclick="switchTab('history')">ประวัติการขาย</button>
        <button type="button" class="tab-btn" id="tabSummary" onclick="switchTab('summary')">สรุปยอดตามเมนู</button>
    </div>

    <div class="list-container" id="historyView">
        <div id="itemList"></div>
    </div>

    <div class="list-container" id="summaryView" style="display: none;">
        <div id="menuSummaryList"></div>
    </div>

    <button type="button" class="btn-clear" onclick="clearToday()">ล้างข้อมูลยอดขายทั้งหมด</button>
</div>

<script>
    function getTodayString() {
        const d = new Date();
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    const STORAGE_KEY = 'SHOP_SALES_RECORDS_V2';
    
    function loadSales() {
        try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        } catch (e) {
            return [];
        }
    }

    let sales = loadSales();
    let selectedCategory = 'auto';

    const quickInput = document.getElementById('quickInput');
    const totalAmount = document.getElementById('totalAmount');
    const totalItems = document.getElementById('totalItems');
    const itemList = document.getElementById('itemList');
    const menuSummaryList = document.getElementById('menuSummaryList');

    function setCategory(cat, btn) {
        selectedCategory = cat;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        quickInput.focus();
    }

    function detectCategory(name) {
        if (selectedCategory !== 'auto') return selectedCategory;
        const n = name.toLowerCase();
        if (n.includes('ปัง') || n.includes('โทสต์') || n.includes('เนยนม') || n.includes('สังขยา')) return 'ขนมปังปิ้ง';
        if (n.includes('เฟรน') || n.includes('ทอด') || n.includes('เก็ต') || n.includes('ชีส') || n.includes('ไก่') || n.includes('ลูกชิ้น') || n.includes('ไส้กรอก')) return 'ของทอด/ทานเล่น';
        if (n.includes('กะเพรา') || n.includes('ข้าว') || n.includes('ไข่') || n.includes('ผัด') || n.includes('มาม่า') || n.includes('ยำ')) return 'อาหาร/กะเพรา';
        return 'เครื่องดื่ม';
    }

    function handleAdd(e) {
        e.preventDefault();
        const text = quickInput.value.trim();
        if (!text) return false;

        let name = '';
        let unitPrice = 0;
        let qty = 1;

        const parts = text.split(/\s+/);

        if (parts.length >= 3 && !isNaN(parts[parts.length - 1]) && !isNaN(parts[parts.length - 2])) {
            qty = parseInt(parts[parts.length - 1]);
            unitPrice = parseFloat(parts[parts.length - 2]);
            name = parts.slice(0, parts.length - 2).join(' ');
        } else if (parts.length >= 2) {
            const lastPart = parts[parts.length - 1];
            if (lastPart.includes('*')) {
                const [p, q] = lastPart.split('*');
                unitPrice = parseFloat(p);
                qty = parseInt(q) || 1;
                name = parts.slice(0, parts.length - 1).join(' ');
            } else if (!isNaN(lastPart)) {
                unitPrice = parseFloat(lastPart);
                qty = 1;
                name = parts.slice(0, parts.length - 1).join(' ');
            }
        }

        if (!name || isNaN(unitPrice) || unitPrice <= 0 || qty <= 0) {
            alert('กรุณาพิมพ์ เช่น:\n- ชาเขียว 30\n- ชาเขียว 30 2 (สั่ง 2 แก้ว)\n- เฟรนฟราย 40');
            return false;
        }

        const category = detectCategory(name);
        const totalPrice = unitPrice * qty;
        const now = new Date();
        const timeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

        sales.push({ 
            id: Date.now(),
            date: getTodayString(),
            name, 
            unitPrice, 
            qty, 
            totalPrice, 
            category,
            time: timeStr 
        });

        saveAndRender();
        quickInput.value = '';
        return false;
    }

    function saveAndRender() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(sales));
        
        const today = getTodayString();
        const todaySales = sales.filter(item => item.date === today);

        let total = 0;
        let totalPieces = 0;
        
        const catStats = {
            'เครื่องดื่ม': { sum: 0, count: 0 },
            'ของทอด/ทานเล่น': { sum: 0, count: 0 },
            'ขนมปังปิ้ง': { sum: 0, count: 0 },
            'อาหาร/กะเพรา': { sum: 0, count: 0 }
        };

        const menuGrouped = {
            'เครื่องดื่ม': {},
            'ของทอด/ทานเล่น': {},
            'ขนมปังปิ้ง': {},
            'อาหาร/กะเพรา': {}
        };

        itemList.innerHTML = '';
        
        if (todaySales.length === 0) {
            itemList.innerHTML = '<div class="empty-text">ยังไม่มีรายการขายในวันนี้</div>';
        } else {
            todaySales.slice().reverse().forEach((item) => {
                total += item.totalPrice;
                totalPieces += item.qty;

                const cat = catStats[item.category] ? item.category : 'อาหาร/กะเพรา';
                catStats[cat].sum += item.totalPrice;
                catStats[cat].count += item.qty;

                if (!menuGrouped[cat][item.name]) menuGrouped[cat][item.name] = { qty: 0, sum: 0 };
                menuGrouped[cat][item.name].qty += item.qty;
                menuGrouped[cat][item.name].sum += item.totalPrice;

                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `
                    <div>
                        <div class="item-title">${item.name} <span style="color:#0284c7;">x${item.qty}</span> <span class="badge">${cat}</span></div>
                        <div class="item-detail">(@${item.unitPrice} บ.) • ${item.time} น.</div>
                    </div>
                    <div style="display:flex; align-items:center;">
                        <span class="item-price">฿${item.totalPrice}</span>
                        <button class="btn-del" onclick="deleteItem(${item.id})">ลบ</button>
                    </div>
                `;
                itemList.appendChild(row);
            });
        }

        document.getElementById('catDrinkSum').innerText = `฿${catStats['เครื่องดื่ม'].sum.toLocaleString()}`;
        document.getElementById('catDrinkCount').innerText = `${catStats['เครื่องดื่ม'].count} แก้ว`;

        document.getElementById('catSnackSum').innerText = `฿${catStats['ของทอด/ทานเล่น'].sum.toLocaleString()}`;
        document.getElementById('catSnackCount').innerText = `${catStats['ของทอด/ทานเล่น'].count} รายการ`;

        document.getElementById('catBreadSum').innerText = `฿${catStats['ขนมปังปิ้ง'].sum.toLocaleString()}`;
        document.getElementById('catBreadCount').innerText = `${catStats['ขนมปังปิ้ง'].count} ชิ้น`;

        document.getElementById('catFoodSum').innerText = `฿${catStats['อาหาร/กะเพรา'].sum.toLocaleString()}`;
        document.getElementById('catFoodCount').innerText = `${catStats['อาหาร/กะเพรา'].count} จาน/อื่นๆ`;

        menuSummaryList.innerHTML = '';
        let hasMenu = false;
        for (const [catName, items] of Object.entries(menuGrouped)) {
            const keys = Object.keys(items);
            if (keys.length > 0) {
                hasMenu = true;
                const groupTitle = document.createElement('div');
                groupTitle.className = 'summary-group-title';
                groupTitle.innerText = `${catName} (รวม ฿${catStats[catName].sum.toLocaleString()})`;
                menuSummaryList.appendChild(groupTitle);

                for (const [name, data] of Object.entries(items)) {
                    const row = document.createElement('div');
                    row.className = 'summary-row';
                    row.innerHTML = `
                        <span>${name} (x${data.qty})</span>
                        <span><b>฿${data.sum}</b></span>
                    `;
                    menuSummaryList.appendChild(row);
                }
            }
        }
        if (!hasMenu) {
            menuSummaryList.innerHTML = '<div class="empty-text">ยังไม่มีข้อมูลสรุปเมนู</div>';
        }

        totalAmount.innerText = `฿${total.toLocaleString()}`;
        totalItems.innerText = `ขายได้รวม ${totalPieces} ชิ้น/แก้ว (${todaySales.length} ออเดอร์)`;
    }

    function deleteItem(id) {
        sales = sales.filter(item => item.id !== id);
        saveAndRender();
    }

    function clearToday() {
        if (confirm('ต้องการล้างข้อมูลยอดขายทั้งหมดใช่หรือไม่?')) {
            sales = [];
            saveAndRender();
        }
    }

    function switchTab(tab) {
        document.getElementById('tabHistory').className = `tab-btn ${tab === 'history' ? 'active' : ''}`;
        document.getElementById('tabSummary').className = `tab-btn ${tab === 'summary' ? 'active' : ''}`;
        document.getElementById('historyView').style.display = tab === 'history' ? 'block' : 'none';
        document.getElementById('summaryView').style.display = tab === 'summary' ? 'block' : 'none';
    }

    window.addEventListener('DOMContentLoaded', () => {
        saveAndRender();
    });
</script>
</body>
</html>
